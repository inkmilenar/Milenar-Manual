*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--preto)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:40px 24px;background:var(--preto);color:var(--offwhite);font-family:Raleway,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-variant-numeric:lining-nums;overflow:hidden;position:relative}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

/* estrela off white batendo nos cantos, como a logo do DVD; passa por cima do texto invertendo a cor, para nada ficar ilegível */
.dvd{position:fixed;left:0;top:0;width:170px;aspect-ratio:300/346;background:var(--offwhite);-webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat;mix-blend-mode:difference;pointer-events:none;z-index:2;will-change:transform;transform:translate(calc(100vw - 230px),calc(100svh - 260px))}

.logo{display:block;width:150px;position:relative;z-index:1}
.logo img{display:block;width:100%;height:auto;filter:invert(1) brightness(.97)}
main{position:relative;z-index:1;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:40px}
.rotulo{font-size:13px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;display:flex;align-items:center;gap:14px;opacity:.8}
.rotulo:before,.rotulo:after{content:"";width:28px;height:1px;background:currentColor;opacity:.6}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(150px,22vw,280px);line-height:.82;letter-spacing:-.02em;margin:18px 0 26px}
p{font-size:17px;line-height:1.55;letter-spacing:.02em;max-width:34ch;margin-bottom:34px;opacity:.85}
.botao{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 30px;background:var(--offwhite);color:var(--preto);border:1px solid var(--offwhite);font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;transition:background .25s ease,color .25s ease}
.botao:hover,.botao:focus-visible{background:transparent;color:var(--offwhite)}
:focus-visible{outline:1px solid currentColor;outline-offset:4px}
@media (max-width:600px){
 body{padding:30px 20px}
 .logo{width:120px}
 .rotulo{font-size:11px}
 h1{font-size:clamp(130px,42vw,190px);margin:14px 0 22px}
 p{font-size:15px}
 .botao{height:48px;padding:0 24px;font-size:12px}
 .dvd{width:110px}
}
</style>
</head>
